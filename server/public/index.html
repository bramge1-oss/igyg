<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ramat Remote</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0b0c;color:#fff}header{padding:16px 18px;border-bottom:1px solid #28282c;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}.dot{width:10px;height:10px;border-radius:50%;background:#777;display:inline-block;margin-left:7px}.dot.on{background:#36c96b}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#151518;border:1px solid #2b2b30;border-radius:16px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;color:#bbb;margin-bottom:5px}input,button,select{width:100%;min-height:46px;border-radius:11px;border:1px solid #34343a;background:#0f0f12;color:#fff;padding:10px;font-size:16px}button{background:#c40006;border:none;font-weight:700;cursor:pointer}.secondary{background:#25252a}.danger{background:#6e1114}.screenShell{position:relative;background:#000;border-radius:14px;overflow:hidden;touch-action:none;min-height:220px;display:flex;align-items:center;justify-content:center}.screenShell img{max-width:100%;width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}.hint{font-size:13px;color:#aaa;line-height:1.6}.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.toolbar button{font-size:14px;padding:7px}.kbd{display:flex;gap:8px;margin-top:10px}.kbd input{flex:1}.kbd button{width:auto;min-width:92px}.status{font-size:13px;color:#bbb}.footer{text-align:center;color:#777;font-size:12px;padding:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><b>Ramat Remote</b><span class="status"><span id="dot" class="dot"></span><span id="state">غير متصل</span></span></header>
<div class="wrap">
  <section id="login" class="card">
    <div class="grid">
      <div><label>رقم الجهاز</label><input id="code" inputmode="numeric" autocomplete="off" placeholder="مثال: 58319427"></div>
      <div><label>كلمة المرور</label><input id="password" type="password" inputmode="numeric" autocomplete="off" placeholder="كلمة المرور المؤقتة"></div>
    </div>
    <div style="margin-top:10px"><button id="connect">اتصال بالكمبيوتر</button></div>
    <p class="hint">ابدأ المشاركة من برنامج Ramat Remote على الكمبيوتر، ثم أدخل رقم الجهاز وكلمة المرور هنا.</p>
  </section>

  <section id="remote" class="card" hidden>
    <div id="screenShell" class="screenShell"><img id="screen" alt="شاشة الكمبيوتر"></div>
    <div class="toolbar">
      <button id="left" class="secondary">نقرة يسار</button>
      <button id="right" class="secondary">نقرة يمين</button>
      <button id="scrollUp" class="secondary">تمرير ↑</button>
      <button id="scrollDown" class="secondary">تمرير ↓</button>
    </div>
    <div class="kbd"><input id="text" placeholder="اكتب نصًا لإرساله للكمبيوتر"><button id="sendText">إرسال</button></div>
    <div class="toolbar">
      <button data-key="ENTER" class="secondary">Enter</button><button data-key="BACKSPACE" class="secondary">Backspace</button><button data-key="ESC" class="secondary">Esc</button><button id="disconnect" class="danger">قطع الاتصال</button>
    </div>
    <p class="hint">المس الشاشة لتحريك المؤشر. السحب يحرك الماوس، واللمسة السريعة تنفذ نقرة يسار. التحكم يعمل فقط أثناء جلسة مشاركة بدأها صاحب الكمبيوتر.</p>
  </section>
  <div class="footer">تطوير البرنامج: يوسف العمري</div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id); const code=$('code'), password=$('password'), screen=$('screen'), shell=$('screenShell');
let connected=false, timer=null, sw=1, sh=1, down=false, moved=false, lastX=0,lastY=0, objectUrl=null;
function setState(t,on=false){$('state').textContent=t;$('dot').classList.toggle('on',on)}
async function apiInput(data){if(!connected)return; try{await fetch('/api/input',{method:'POST',headers:{'Content-Type':'application/json','X-Code':code.value.trim(),'X-Password':password.value},body:JSON.stringify(data),cache:'no-store'})}catch{}}
async function refresh(){if(!connected)return; try{const r=await fetch('/api/frame?code='+encodeURIComponent(code.value.trim()),{headers:{'X-Password':password.value},cache:'no-store'}); if(r.status===403){disconnect('تم رفض بيانات الجلسة');return;} if(r.ok && r.status!==204){sw=Number(r.headers.get('X-Screen-Width')||sw);sh=Number(r.headers.get('X-Screen-Height')||sh); const b=await r.blob(); const u=URL.createObjectURL(b); screen.onload=()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=u};screen.src=u;} setState('متصل',true);}catch{setState('إعادة الاتصال…',false)} finally{if(connected)timer=setTimeout(refresh,140)}}
async function connect(){const c=code.value.replace(/\D/g,'');code.value=c;if(c.length<6||password.value.length<4){alert('أدخل رقم الجهاز وكلمة المرور');return;} setState('جاري الاتصال…'); try{const r=await fetch('/api/status?code='+encodeURIComponent(c),{headers:{'X-Password':password.value},cache:'no-store'});if(!r.ok)throw new Error(); const d=await r.json();sw=d.width||1;sh=d.height||1;connected=true;$('login').hidden=true;$('remote').hidden=false;refresh();}catch{setState('فشل الاتصال');alert('تعذر الاتصال. تحقق من رقم الجهاز وكلمة المرور.')}}
function disconnect(msg='تم قطع الاتصال'){connected=false;if(timer)clearTimeout(timer);$('remote').hidden=true;$('login').hidden=false;setState(msg,false)}
function mapPoint(ev){const r=screen.getBoundingClientRect();const x=Math.max(0,Math.min(sw-1,(ev.clientX-r.left)*sw/r.width));const y=Math.max(0,Math.min(sh-1,(ev.clientY-r.top)*sh/r.height));return{x:Math.round(x),y:Math.round(y)}}
shell.addEventListener('pointerdown',e=>{if(!connected)return;down=true;moved=false;shell.setPointerCapture?.(e.pointerId);const p=mapPoint(e);lastX=p.x;lastY=p.y;apiInput({type:'mouse',action:'move',x:p.x,y:p.y})});
shell.addEventListener('pointermove',e=>{if(!connected||!down)return;const p=mapPoint(e);if(Math.abs(p.x-lastX)+Math.abs(p.y-lastY)>3)moved=true;lastX=p.x;lastY=p.y;apiInput({type:'mouse',action:'move',x:p.x,y:p.y})});
shell.addEventListener('pointerup',e=>{if(!connected)return;const p=mapPoint(e);apiInput({type:'mouse',action:'move',x:p.x,y:p.y});if(!moved){apiInput({type:'mouse',action:'click',button:'left',x:p.x,y:p.y})}down=false});
shell.addEventListener('wheel',e=>{e.preventDefault();apiInput({type:'mouse',action:'wheel',delta:e.deltaY<0?120:-120})},{passive:false});
$('connect').addEventListener('click',connect);$('disconnect').addEventListener('click',()=>disconnect());
$('left').addEventListener('click',()=>apiInput({type:'mouse',action:'click',button:'left'}));$('right').addEventListener('click',()=>apiInput({type:'mouse',action:'click',button:'right'}));
$('scrollUp').addEventListener('click',()=>apiInput({type:'mouse',action:'wheel',delta:240}));$('scrollDown').addEventListener('click',()=>apiInput({type:'mouse',action:'wheel',delta:-240}));
$('sendText').addEventListener('click',()=>{const v=$('text').value;if(v){apiInput({type:'text',text:v.slice(0,500)});$('text').value=''}});document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>apiInput({type:'key',key:b.dataset.key})));
})();
</script>
</body></html>
